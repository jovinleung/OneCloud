name: Build OneCloud-OpenWrt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1,16 * *"

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: OneCloud-OpenWrt/.config
  DIY_P1_SH: OneCloud-OpenWrt/op1.sh
  DIY_P2_SH: OneCloud-OpenWrt/op2.sh
  DIY_P3_SH: OneCloud-OpenWrt/op3.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 1G

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 释放磁盘空间
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo docker image prune -a -f
        sudo systemctl stop docker
        sudo apt-get -y purge firefox clang* ghc* google* llvm* mono* mongo* mysql* php*
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
        sudo rm -rf /etc/mysql /etc/php /usr/lib/jvm /usr/libexec/docker /usr/src/* /var/lib/docker /var/lib/gems /var/lib/mysql /var/lib/snapd /etc/skel /opt/{microsoft,az,hostedtoolcache,cni,mssql-tools,pipx} /usr/share/{az*,dotnet,swift,miniconda,gradle*,java,kotlinc,ri,sbt} /root/{.sbt,.local,.npm}
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        rm -rf ~/{.cargo,.dotnet,.rustup}
        # 安装编译依赖
        sudo apt-get update -y
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
                                gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
                                python3-setuptools rsync swig unzip zlib1g-dev file wget \
                                android-sdk-libsparse-utils ccache
        sudo apt-get clean
        sudo timedatectl set-timezone 'Asia/Shanghai'
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        ccache -M $CCACHE_MAXSIZE
        ccache -z
        df -hT

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH --depth 1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache ccache, toolchain and downloads
      uses: actions/cache@main
      with:
        path: |
          /home/runner/.ccache
          /workdir/openwrt/dl
          /workdir/openwrt/staging_dir
        key: ${{ runner.os }}-onecloud-${{ env.REPO_BRANCH }}-${{ hashFiles('OneCloud-OpenWrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-onecloud-${{ env.REPO_BRANCH }}-
          ${{ runner.os }}-onecloud-

    - name: Load onecloud target
      run: |
        [ -e OneCloud-OpenWrt/target ] && cp -rf OneCloud-OpenWrt/target openwrt/

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Remove and replace some feeds (op3)
      run: |
        chmod +x $DIY_P3_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P3_SH

    - name: Second update feed
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        echo "CONFIG_CCACHE=y" >> .config
        make defconfig
        # 禁用 yq（Go 交叉编译 ARM32 常失败，旁路由不需要）
        sed -i 's/^CONFIG_PACKAGE_yq=y$/# CONFIG_PACKAGE_yq is not set/' .config
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        ccache -z
        echo -e "$(nproc) thread compile"
        make -j$(nproc)
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d")" >> $GITHUB_ENV
        ccache -s

    - name: Generate direct burn image
      if: steps.compile.outputs.status == 'success'
      run: |
        # 下载玩客云专用 u-boot 和线刷打包工具
        ver="v0.3.1"
        curl -L -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
        chmod +x ./AmlImg
        curl -L -o ./uboot.img https://github.com/hzyitc/u-boot-onecloud/releases/download/build-20221028-0940/eMMC.burn.img
        ./AmlImg unpack ./uboot.img burn/

        # 解压 rootfs 镜像
        gunzip -f openwrt/bin/targets/*/*/*.img.gz 2>/dev/null || true
        diskimg=$(ls openwrt/bin/targets/*/*/*.img 2>/dev/null | head -1)
        if [ -z "$diskimg" ]; then
          echo "未找到 .img 镜像，跳过载入线刷包"
          exit 0
        fi

        loop=$(sudo losetup --find --show --partscan $diskimg)
        sudo rm -rf openwrt.img xd img
        sudo dd if=/dev/zero of=openwrt.img bs=1M count=400
        sudo mkfs.ext4 -F openwrt.img
        sudo mkdir xd img
        sudo mount openwrt.img xd
        sudo mount ${loop}p2 img
        sudo cp -r img/* xd/
        sudo sync
        sudo umount xd
        sudo umount img
        sudo img2simg ${loop}p1 burn/boot.simg
        sudo img2simg openwrt.img burn/rootfs.simg
        sudo rm -rf openwrt.img xd img
        sudo losetup -d $loop

        cat <<EOF >> burn/commands.txt
        PARTITION:boot:sparse:boot.simg
        PARTITION:rootfs:sparse:rootfs.simg
        EOF
        prefix=$(echo "$diskimg" | sed 's/\.img$//')
        burnimg=${prefix}.burn.img
        ./AmlImg pack "$burnimg" burn/
        # 安全处理：仅当存在 .burn.img 时才压缩
        shopt -s nullglob
        burn_imgs=(openwrt/bin/targets/*/*/*.burn.img)
        if [ ${#burn_imgs[@]} -gt 0 ]; then
          for f in "${burn_imgs[@]}"; do
            sha256sum "$f" >"${f}.sha"
            xz -6 --threads=0 --compress "$f"
          done
        fi
        shopt -u nullglob
        # 删除原始 .img，只保留线刷包 .burn.img.xz
        sudo rm -f openwrt/bin/targets/*/*/*.img

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OneCloud-OpenWrt${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y%m%d")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Delete old releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
