name: Build OneCloud ImmortalWrt

on:
  workflow_dispatch:

concurrency:
  group: onecloud-immortalwrt-build
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: OneCloud-ImmortalWrt/.config
  DIY_P1_SH: OneCloud-ImmortalWrt/op1.sh
  DIY_P2_SH: OneCloud-ImmortalWrt/op2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 1G
  GOPROXY: https://proxy.golang.org,direct
  GOFLAGS: -mod=mod
  # cachewrtbuild 缓存标识
  OWRT_brun_type: immortalwrt
  OWRT_CFG: thunder-onecloud

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Free disk space
      uses: rmoyulong/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
                                gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
                                python3-setuptools rsync swig unzip zlib1g-dev file wget \
                                ccache mtools dosfstools
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        # ubuntu-24.04 官方源已移除 img2simg，从源码编译（burn.img sparse 格式所需）
        if ! command -v img2simg &>/dev/null; then
          git clone --depth 1 https://github.com/anestisb/android-simg2img.git /tmp/simg2img
          make -C /tmp/simg2img -j$(nproc)
          sudo cp /tmp/simg2img/img2simg /tmp/simg2img/simg2img /usr/local/bin/
          rm -rf /tmp/simg2img
        fi
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir
        ccache -M $CCACHE_MAXSIZE

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --depth 1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 启动缓存[第二次起生效]
      uses: rmoyulong/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt
        mixkey: ${{ env.OWRT_brun_type }}/tree/${{ env.REPO_BRANCH }}?device=${{ env.OWRT_CFG }}

    - name: Cache downloads
      uses: actions/cache@main
      with:
        path: /workdir/openwrt/dl
        key: ${{ runner.os }}-onecloud-dl-${{ hashFiles('OneCloud-ImmortalWrt/.config', 'OneCloud-ImmortalWrt/op1.sh') }}
        restore-keys: |
          ${{ runner.os }}-onecloud-dl-

    - name: Load target and feeds
      run: |
        # 加载 OneCloud amlogic meson8b target（含 image 生成脚本、u-boot、AmlImg）
        [ -e OneCloud-ImmortalWrt/target ] && cp -rf OneCloud-ImmortalWrt/target openwrt/
        # DIY Part1：添加第三方 feed、获取最新包、内核模块自动加载
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        echo "CONFIG_CCACHE=y" >> .config
        make defconfig
        make download -j$(( $(nproc) + 1 ))
        # 清理下载不完整的小文件（排除 go-mod-cache，其中含大量合法小文件）
        find dl -size -1024c -not -path "dl/go-mod-cache/*" -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        ccache -z
        echo "Building with $(nproc) threads"
        # 先并行编译，失败时用 -j1 V=s 获取详细错误
        make -j$(( $(nproc) + 1 )) || {
          echo "=== Parallel build failed, rebuilding with -j1 V=s ==="
          make -j1 V=s 2>&1 | tail -300
          exit 1
        }
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d")" >> $GITHUB_ENV
        ccache -s

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ImmortalWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        ls -lh

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OneCloud-ImmortalWrt${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y%m%d")" >> $GITHUB_OUTPUT
        {
          echo "## OneCloud ImmortalWrt Firmware"
          echo ""
          echo "- Build date: $(date +"%Y-%m-%d")"
          echo "- Device: Thunder OneCloud (Amlogic S805 / Meson8b)"
          echo "- Kernel: 6.18"
          echo "- ImmortalWrt branch: $REPO_BRANCH"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Delete old releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
