# Amlogic Meson8b network performance optimizations
# Applied at boot via sysctl --system

# --- TCP behaviour ---
# Probe MTU path to avoid black-hole connections (PMTUD)
net.ipv4.tcp_mtu_probing=1

# Reduce per-socket unsent bytes lower bound (lower latency)
net.ipv4.tcp_notsent_lowat=16384

# Linear timeouts for thin streams (SSH/gaming), less retx penalty
net.ipv4.tcp_thin_linear_timeouts=1

# TCP Fast Open: enable for both client and server (kernel has CONFIG_TCP_FASTOPEN)
net.ipv4.tcp_fastopen=3

# Explicit BBR (kernel default, documented here for clarity)
net.ipv4.tcp_congestion_control=bbr

# --- Socket buffers (1 Gbps link with proxy traffic) ---
# Max receive/send buffer: 4 MB (safe on 1 GB RAM; BDP at 1 Gbps / 30 ms ≈ 3.75 MB)
net.core.rmem_max=4194304
net.core.wmem_max=4194304

# Auto-tuning buffer ranges: min default max
net.ipv4.tcp_rmem=4096 87380 4194304
net.ipv4.tcp_wmem=4096 65536 4194304

# --- NIC / stack ---
# Larger RX backlog for bursty traffic
net.core.netdev_max_backlog=8192

# fq is the recommended qdisc for BBR (kernel default may be fq_codel)
net.core.default_qdisc=fq

# Increase listen backlog for high connection rates
net.core.somaxconn=8192

# --- Connection handling ---
# Larger SYN backlog to avoid dropping under bursty loads
net.ipv4.tcp_max_syn_backlog=2048

# Reuse TIME_WAIT sockets for outbound connections
net.ipv4.tcp_tw_reuse=1

# Increase orphan socket capacity (half-closed connections under proxy load)
net.ipv4.tcp_max_orphans=8192

# Wider local port range for many concurrent outbound connections
net.ipv4.ip_local_port_range=1024 65535

# Faster keepalive detection (3 probes * 30s = 90s vs default 9*75s = 675s)
net.ipv4.tcp_keepalive_intvl=30
net.ipv4.tcp_keepalive_probes=3

# --- Security / hardening ---
# Reverse path filtering (anti-spoofing)
net.ipv4.conf.default.rp_filter=1
net.ipv4.conf.all.rp_filter=1

# Ignore ICMP redirects (bypass router has no legitimate use for them)
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.send_redirects=0

# Rate-limit ICMP responses to prevent abuse
net.ipv4.icmp_ratelimit=100

# --- Latency / jitter mitigation (WiFi-friendly bypass router) ---
# Keep cwnd after idle: avoids slow-start restart after WiFi pauses/roaming
net.ipv4.tcp_slow_start_after_idle=0

# Dont save per-route metrics: avoids stale high-RTT from WiFi jitter
# polluting subsequent connections to the same destination
net.ipv4.tcp_no_metrics_save=1

# No autocork: send small packets immediately (lower interactive latency
# for SSH, gaming, DNS; BDP-sized sockets still accumulate via TSO/GSO)
net.ipv4.tcp_autocorking=0

# Faster failure detection: 8 retries ~100s instead of 15 ~900s
# (bypass router behind another NAT; dead peers should be detected quickly)
net.ipv4.tcp_retries2=8

# Explicit Congestion Notification: works well with BBR
net.ipv4.tcp_ecn=1

# --- Memory management (1 GB RAM with zram-swap) ---
# Lower swap tendency: prefer keeping apps in RAM, use zram only under pressure
vm.swappiness=10
# Retain more inode/dentry cache (file server workload benefits)
vm.vfs_cache_pressure=50
# Reduce dirty page ratios: lower eMMC write bursts, smoother latency
vm.dirty_ratio=10
vm.dirty_background_ratio=5

# --- Conntrack (bypass router handles many simultaneous proxy connections) ---
# 1 GB RAM: 262144 entries is safe (~100 MB max, typical ~20 MB)
net.netfilter.nf_conntrack_max=262144
# Shrink established timeout from 5d to 1d — frees stale entries under proxy load
net.netfilter.nf_conntrack_tcp_timeout_established=86400
# Faster close of TIME_WAIT (default 120s -> 60s)
net.netfilter.nf_conntrack_tcp_timeout_time_wait=60

# --- Bridge netfilter (CRITICAL for single-NIC bypass router) ---
# MUST be disabled on single-NIC bypass routers: hairpin NAT means packets
# enter and exit the same br-lan bridge. With bridge-nf-call-iptables=1,
# bridged IPv4 packets traverse netfilter a second time at the bridge layer,
# causing conntrack state corruption — all TCP connections get stuck in
# SYN_RECV and clients have "no internet" despite DNS/UDP working.
net.bridge.bridge-nf-call-iptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-arptables=0
