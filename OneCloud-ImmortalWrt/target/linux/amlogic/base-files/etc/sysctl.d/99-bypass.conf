# OneCloud bypass router sysctl optimizations
# Enhanced version with network performance tuning

# === IP forwarding ===
net.ipv4.ip_forward=1
net.ipv4.conf.all.forwarding=1
net.ipv4.conf.default.forwarding=1

# === ARP settings for single-arm bypass mode ===
net.ipv4.conf.all.arp_ignore=1
net.ipv4.conf.default.arp_ignore=1
net.ipv4.conf.all.arp_announce=2
net.ipv4.conf.default.arp_announce=2
net.ipv4.conf.all.arp_filter=0
net.ipv4.conf.default.arp_filter=0

# === TCP optimizations ===
net.ipv4.tcp_syncookies=1
net.ipv4.tcp_fin_timeout=30
net.ipv4.tcp_keepalive_time=120
net.ipv4.tcp_keepalive_intvl=30
net.ipv4.tcp_keepalive_probes=3
net.ipv4.tcp_tw_reuse=1
net.ipv4.tcp_sack=1
net.ipv4.tcp_dsack=1
net.ipv4.tcp_timestamps=1
net.ipv4.tcp_window_scaling=1
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_no_metrics_save=1
net.ipv4.tcp_ecn=2
net.ipv4.tcp_frto=2
net.ipv4.tcp_limit_output_bytes=262144
net.ipv4.tcp_challenge_ack_limit=1000

# === TCP congestion control (BBR if available, fallback to cubic) ===
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# === Network buffer tuning (enhanced for gigabit) ===
net.core.netdev_max_backlog=16384
net.core.netdev_budget=600
net.core.netdev_budget_usecs=8000
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.rmem_default=262144
net.core.wmem_default=262144
net.core.somaxconn=4096
net.core.optmem_max=65536
net.ipv4.tcp_rmem=4096 65536 16777216
net.ipv4.tcp_wmem=4096 32768 16777216
net.ipv4.tcp_fastopen=3
net.ipv4.udp_rmem_min=8192
net.ipv4.udp_wmem_min=8192

# === Connection tracking (enhanced) ===
net.netfilter.nf_conntrack_max=262144
net.netfilter.nf_conntrack_tcp_timeout_established=3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait=30
net.netfilter.nf_conntrack_tcp_timeout_close_wait=60
net.netfilter.nf_conntrack_tcp_timeout_fin_wait=30
net.netfilter.nf_conntrack_tcp_timeout_syn_recv=30
net.netfilter.nf_conntrack_udp_timeout=30
net.netfilter.nf_conntrack_udp_timeout_stream=120
net.netfilter.nf_conntrack_icmp_timeout=10
net.netfilter.nf_conntrack_events=1
net.netfilter.nf_conntrack_acct=1

# === ICMP settings ===
net.ipv4.icmp_echo_ignore_all=0
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1
net.ipv4.icmp_errors_use_inbound_ifaddr=1

# === Reduce eMMC writes - memory management ===
vm.swappiness=10
vm.dirty_ratio=10
vm.dirty_background_ratio=5
vm.dirty_expire_centisecs=6000
vm.dirty_writeback_centisecs=500
vm.vfs_cache_pressure=50
vm.min_free_kbytes=65536
vm.max_map_count=262144
vm.user_reserve_kbytes=131072

# === Kernel panic auto-reboot ===
kernel.panic=3
kernel.panic_on_oops=1

# === Kernel performance ===
kernel.timer_migration=1
kernel.watchdog=1
kernel.watchdog_thresh=10

# === File system ===
fs.file-max=1048576
fs.inotify.max_user_instances=8192
fs.inotify.max_user_watches=524288
fs.lease-break-time=45
fs.aio-max-nr=1048576

# === Network interface generic optimizations ===
# Bypass router (single-arm): use loose rp_filter (2) because traffic
# enters and leaves the same interface; strict mode (1) would drop it.
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.secure_redirects=1
net.ipv4.conf.default.secure_redirects=1
# Disable send_redirects: bypass router shouldn't send ICMP redirects
# when forwarding traffic back to the same subnet (single-arm mode).
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.log_martians=0
net.ipv4.conf.default.log_martians=0
net.ipv4.conf.all.bootp_relay=0
net.ipv4.conf.all.proxy_arp=0
net.ipv4.conf.all.force_igmp_version=0
net.ipv4.igmp_max_memberships=42
net.ipv4.igmp_max_msf=10
net.ipv4.igmp_qrv=2

# === Bridging optimizations ===
# Disable bridge netfilter calls for performance. In bypass router mode,
# client traffic is routed (destination MAC = bypass router itself),
# not bridged, so TPROXY in nftables inet prerouting works without this.
# This also avoids CPU overhead of passing bridged traffic through netfilter.
net.bridge.bridge-nf-call-iptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-arptables=0
net.bridge.bridge-nf-filter-vlan-tagged=0
net.bridge.bridge-nf-filter-pppoe-tagged=0

# === Network core performance ===
net.core.netdev_tstamp_prequeue=0
net.core.dev_weight=64
net.core.busy_poll=0
net.core.busy_read=0

# === TCP performance for high-BDP ===
net.ipv4.tcp_notsent_lowat=131072
net.ipv4.tcp_autocorking=1
net.ipv4.tcp_early_retrans=3
net.ipv4.tcp_recovery=1
net.ipv4.tcp_thin_linear_timeouts=1
net.ipv4.tcp_min_tso_segs=2
net.ipv4.tcp_tso_win_divisor=3

# === UDP performance ===
net.ipv4.udp_mem=8192 43690 8388608

# === ICMP rate limit (more permissive for LAN) ===
net.ipv4.icmp_ratelimit=1000
net.ipv4.icmp_ratemask=88089

# === IPv6 disabled for bypass router ===
# As a single-arm bypass router, IPv6 is handled by the main router.
# Disable IPv6 forwarding and autoconfiguration to avoid conflicts.
net.ipv6.conf.all.forwarding=0
net.ipv6.conf.default.forwarding=0
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1
net.ipv6.conf.all.accept_ra=0
net.ipv6.conf.default.accept_ra=0
net.ipv6.conf.all.autoconf=0
net.ipv6.conf.default.autoconf=0
